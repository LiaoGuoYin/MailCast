#:schema node_modules/wrangler/config-schema.json
name = "mailcast"
main = "src/index.ts"
compatibility_date = "2026-07-08"
workers_dev = true
# Keep vars set in the Cloudflare dashboard; this shared template defines none.
keep_vars = true

assets = { directory = "./public", not_found_handling = "single-page-application", run_worker_first = ["/api/*"] }

# Compile the console (web/*.ts) into public/*.js before every deploy and on
# each change under `wrangler dev`. Wrangler runs this command without
# node_modules/.bin on PATH, so call the local TypeScript through node.
[build]
command = "node node_modules/typescript/bin/tsc -p tsconfig.web.json"
watch_dir = "web"

[secrets]
required = ["ADMIN_PASSWORD"]

[version_metadata]
binding = "CF_VERSION_METADATA"

# Workers AI, used by the optional verification-code extraction
[ai]
binding = "AI"

# No database name or ID: this template is shared by every instance. Wrangler
# reuses the Worker's existing D1 binding on deploy, or provisions a new
# database for a new Worker. scripts/deploy.mjs resolves the live database
# for migrations.
[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"
