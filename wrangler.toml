#:schema node_modules/wrangler/config-schema.json
name = "mailcast"
main = "src/index.ts"
compatibility_date = "2026-07-08"
workers_dev = true

assets = { directory = "./public", not_found_handling = "single-page-application", run_worker_first = ["/api/*"] }

[secrets]
required = ["ADMIN_PASSWORD"]

[version_metadata]
binding = "CF_VERSION_METADATA"

# Workers AI, used by the optional verification-code extraction
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "mailcast"
# Deploy to Cloudflare replaces this template ID with the provisioned database ID.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
